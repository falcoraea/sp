# Setiap kali kamu upload / commit apa pun ke branch main:
#   1. nomor versi otomatis naik (mis. 1.6.0 -> 1.6.43, angka terakhir = nomor build GitHub)
#   2. file version.json dibuat (versi, nomor build, waktu, catatan commit)
#   3. cache aplikasi (sw.js) otomatis diganti, jadi HP pegawai mengambil versi baru
#   4. aplikasi diterbitkan ke GitHub Pages
# Syarat sekali saja: Settings › Pages › Build and deployment › Source = "GitHub Actions".
name: Terbitkan aplikasi

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Cap nomor versi
        run: |
          BASE=$(grep -oP "APP_VERSION = '\K[0-9]+\.[0-9]+" js/config.js || echo "1.0")
          BUILD="${{ github.run_number }}"
          VERSION="$BASE.$BUILD"
          SHA="${GITHUB_SHA::7}"
          NOW=$(TZ=Asia/Jakarta date '+%Y-%m-%dT%H:%M:%S+07:00')
          NOTE=$(git log -1 --pretty=%s | head -c 140)
          jq -n --arg v "$VERSION" --arg b "$BUILD" --arg s "$SHA" --arg d "$NOW" --arg n "$NOTE" \
            '{version:$v, build:$b, sha:$s, date:$d, note:$n}' > version.json
          sed -i "s/^export const APP_VERSION = .*/export const APP_VERSION = '$VERSION';/" js/config.js
          sed -i "s/^export const APP_BUILD = .*/export const APP_BUILD = '$BUILD';/" js/config.js
          sed -i "s/^const VERSION = .*/const VERSION = 'v$VERSION';/" sw.js
          echo "Versi $VERSION (build $BUILD, $SHA)"
          cat version.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
